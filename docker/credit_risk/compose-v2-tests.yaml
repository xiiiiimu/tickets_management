name: credit-risk-v2-tests
services:
  redis:
    image: redis:7.2.0
    container_name: credit-risk-v2-redis
    restart: "no"
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --databases 256']
    environment:
      REDIS_PASSWORD: ${CREDIT_RISK_REDIS_PASSWORD}
    ports: ["127.0.0.1:26379:6379"]
    volumes: ["./data/v2-redis:/data"]
    networks: [v2]
networks:
  v2:
    name: credit-risk-v2-test-network
