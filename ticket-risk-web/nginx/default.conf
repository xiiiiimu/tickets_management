# Sprint S5: gateway-level flood shield (cf. xiaoyeshenger OpenResty shared-dict precheck, SecKill-ii RateLimiter).
# Only POST /api/tickets/reservations is limited; GET result queries (by-request) never touch this zone.
# rate = roughly 2-2.5x the measured HELD capacity of ONE app instance (2 vCPU test box: 100r/s; i7 target 200 HELD/s: 400r/s).
map $request_method $reservation_post_key { POST "post"; default ""; }
limit_req_zone $reservation_post_key zone=reservations:1m rate=400r/s;
limit_req_status 429;
upstream ticket_platform { server ticket-risk-platform:8082; keepalive 128; }

server {
 listen 80;
 server_name localhost;
 root /usr/share/nginx/html;
 index index.html;
 location / { try_files $uri $uri/ /index.html; }
 location = /api/tickets/reservations {
  limit_req zone=reservations burst=80 nodelay;
  error_page 429 = @reservation_busy;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP "";
  proxy_pass http://ticket_platform/api/tickets/reservations;
 }
 location @reservation_busy {
  default_type application/json;
  return 429 '{"success":false,"errorMsg":"当前排队人数较多，本次请求未受理（不代表抢票失败），请使用原请求编号稍后重试","data":{"code":"SYSTEM_BUSY","reliableAccepted":false,"retryWithSameRequestId":true}}';
 }
 location /api/ {
  proxy_pass http://ticket-risk-platform:8082/api/;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP "";
 }
}
